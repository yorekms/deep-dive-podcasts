<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CRP Sync Bridge</title></head><body><script>
(function () {
  'use strict';
  var KEY = 'crp_bridge_state_v1';
  function isAllowedOrigin(origin) {
    if (!origin) return false;
    return /^https:\/\/([a-z0-9-]+\.carrd\.co|yorekms\.github\.io)$/i.test(origin);
  }
  function loadMap() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? (JSON.parse(raw) || {}) : {};
    } catch (e) {
      return {};
    }
  }
  function saveMap(map) {
    try {
      localStorage.setItem(KEY, JSON.stringify(map));
    } catch (e) {}
  }
  function sendState(targetWin, origin) {
    if (!targetWin) return;
    try {
      targetWin.postMessage({ type: 'CRPSyncState', map: loadMap() }, origin || '*');
    } catch (e) {}
  }
  window.addEventListener('message', function (ev) {
    if (!isAllowedOrigin(ev.origin) || !ev.data || typeof ev.data !== 'object') return;
    var d = ev.data;
    if (d.type === 'CRPSyncInit') {
      if (d.map && typeof d.map === 'object') {
        var cur = loadMap();
        var changed = false;
        for (var k in d.map) {
          if (Object.prototype.hasOwnProperty.call(d.map, k) && cur[k] === undefined) {
            cur[k] = d.map[k];
            changed = true;
          }
        }
        if (changed) saveMap(cur);
      }
      sendState(ev.source, ev.origin);
    } else if (d.type === 'CRPSyncSet' && d.id) {
      var cur2 = loadMap();
      cur2[d.id] = d.val ? 1 : 0;
      saveMap(cur2);
      sendState(ev.source, ev.origin);
    }
  });
  window.addEventListener('storage', function (ev) {
    if (ev && ev.key === KEY && window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'CRPSyncState', map: loadMap() }, '*');
      } catch (e) {}
    }
  });
})();
</script></body></html>
