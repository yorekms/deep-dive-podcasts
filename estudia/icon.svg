<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35" flood-color="#1e1b4b"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Study Cards Symbol -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Back card tilted -->
    <rect x="90" y="30" width="220" height="280" rx="28" fill="#6366f1" transform="rotate(12 200 170)" opacity="0.6"/>

    <!-- Middle card tilted -->
    <rect x="70" y="30" width="220" height="280" rx="28" fill="#818cf8" transform="rotate(-6 180 170)" opacity="0.85"/>

    <!-- Front card -->
    <rect x="72" y="44" width="240" height="300" rx="28" fill="url(#pageGrad)"/>

    <!-- Card line details -->
    <rect x="108" y="104" width="168" height="20" rx="10" fill="#4f46e5"/>
    <rect x="108" y="144" width="120" height="14" rx="7" fill="#94a3b8"/>
    <rect x="108" y="172" width="144" height="14" rx="7" fill="#cbd5e1"/>

    <!-- Sound waves / pronunciation badge inside card -->
    <circle cx="250" cy="284" r="24" fill="#eef2ff"/>
    <path d="M244 276v16l6-4h4v-8h-4z" fill="#4f46e5"/>
    <path d="M258 278a8 8 0 0 1 0 12" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M263 274a14 14 0 0 1 0 20" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sparkle badge top right -->
  <g transform="translate(350, 80)">
    <path d="M30 0L38 22L60 30L38 38L30 60L22 38L0 30L22 22Z" fill="url(#sparkGrad)"/>
  </g>
</svg>
